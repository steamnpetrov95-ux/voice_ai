name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      VBCABLE_INTEGRATION_AUTHORIZED: ${{ vars.VBCABLE_INTEGRATION_AUTHORIZED }}
      # Owner's personal setup; disabled in public repositories and other forks.
      VBCABLE_PERSONAL_SETUP: ${{ github.event.repository.private && github.repository == 'steamnpetrov95-ux/voice_ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test DSP, audio routing, and desktop UI
        run: python -m pytest -q
      - name: Validate VB-CABLE download and vendor signature
        shell: powershell
        run: ./installer/Install-VirtualMicrophone.ps1 -VerifyOnly
      - name: Build application and single EXE installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -EnableVBCableIntegration:($env:VBCABLE_INTEGRATION_AUTHORIZED -eq 'true' -or $env:VBCABLE_PERSONAL_SETUP -eq 'true')
      - name: Smoke test packaged DSP
        shell: pwsh
        run: |
          python -c "import numpy as np, soundfile as sf; sf.write('smoke-input.wav', np.sin(2*np.pi*220*np.arange(48000)/48000)*0.2, 48000)"
          $process = Start-Process -FilePath dist/VoiceLab/VoiceLab.exe -ArgumentList '--render', 'smoke-input.wav', 'smoke-output.wav', '--preset', 'sakura' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          python -c "import numpy as np, soundfile as sf; a,r=sf.read('smoke-output.wav'); assert r==48000 and len(a)==96000 and np.max(np.abs(a))>0.01"
      - name: Test install, installed application, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VoiceLab-installed'
          $installer = Start-Process -FilePath dist/installer/VoiceLab-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TASKS=desktopicon', "/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Install failed: $($installer.ExitCode)" }
          $app = Join-Path $installDir 'VoiceLab.exe'
          if (-not (Test-Path $app)) { throw 'Installed application is missing' }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'npetrov VoiceLab.lnk'
          $menuShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'npetrov VoiceLab.lnk'
          if (-not (Test-Path $desktopShortcut) -or -not (Test-Path $menuShortcut)) { throw 'Branded application shortcuts are missing' }
          $helperPresent = Test-Path (Join-Path $installDir 'Install-VirtualMicrophone.ps1')
          $integrationEnabled = $env:VBCABLE_INTEGRATION_AUTHORIZED -eq 'true' -or $env:VBCABLE_PERSONAL_SETUP -eq 'true'
          if ($helperPresent -ne $integrationEnabled) { throw 'Virtual microphone integration does not match the selected build' }
          $render = Start-Process -FilePath $app -ArgumentList '--render', 'smoke-input.wav', 'installed-output.wav', '--preset', 'sakura' -Wait -PassThru
          if ($render.ExitCode -ne 0) { throw 'Installed application failed' }
          python -c "import numpy as np, soundfile as sf; a,r=sf.read('installed-output.wav'); assert r==48000 and len(a)==96000 and np.max(np.abs(a))>0.01"
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $app) { throw 'Application was not removed' }
          if ((Test-Path $desktopShortcut) -or (Test-Path $menuShortcut)) { throw 'Application shortcuts were not removed' }
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLab-Setup-Windows-x64
          path: dist/installer/VoiceLab-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLab-Setup-checksum
          path: dist/installer/VoiceLab-Setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: VoiceLab-Setup-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: npetrov VoiceLab ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/VoiceLab-Setup.exe
            release/VoiceLab-Setup.exe.sha256
          fail_on_unmatched_files: true
