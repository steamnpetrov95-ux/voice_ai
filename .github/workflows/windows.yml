name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'scripts/inspect-neural-assets.py'
      - '.github/workflows/neural-models.yml'
      - 'scripts/remote_zip.py'
  pull_request:
  workflow_dispatch:
    inputs:
      include_native_sdk:
        description: 'Bundle the personal native SDK from the supplied installer'
        type: boolean
        default: true
      include_neural_models:
        description: 'Prepare and bundle the six offline Russian models'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the tested installer as the version declared in the app'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      BUILD_NATIVE_SDK: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.include_native_sdk || inputs.publish_release) && github.event.repository.private && github.repository == 'steamnpetrov95-ux/voice_ai' }}
      BUILD_RVC_MODELS: ${{ inputs.include_neural_models && github.event.repository.private && github.repository == 'steamnpetrov95-ux/voice_ai' }}
      QT_QPA_PLATFORM: offscreen
      VBCABLE_INTEGRATION_AUTHORIZED: ${{ vars.VBCABLE_INTEGRATION_AUTHORIZED }}
      # Owner's personal setup; disabled in public repositories and other forks.
      VBCABLE_PERSONAL_SETUP: ${{ github.event.repository.private && github.repository == 'steamnpetrov95-ux/voice_ai' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Test DSP, audio routing, and desktop UI
        run: python -m pytest -q
      - name: Validate VB-CABLE download and vendor signature
        shell: powershell
        run: ./installer/Install-VirtualMicrophone.ps1 -VerifyOnly
      - name: Prepare the personal native SDK and catalogue
        if: env.BUILD_NATIVE_SDK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-native-windows.ps1
      - name: Validate all native profiles and measure offline processing
        if: env.BUILD_NATIVE_SDK == 'true'
        run: |
          $nativePython = (python -c "import sys; print(sys.executable)").Trim()
          New-NetFirewallRule -DisplayName 'npetrov native validation' -Direction Outbound -Program $nativePython -Action Block -Profile Any | Out-Null
          try {
            python scripts/run-native-validation.py --models dist/native-sdk --speech .analysis/speech.wav --stream-seconds 65
            if ($LASTEXITCODE -ne 0) { throw 'Native profile validation failed' }
            python scripts/benchmark-native-latency.py --models dist/native-sdk --speech .analysis/speech.wav
            if ($LASTEXITCODE -ne 0) { throw 'Native short buffer benchmark failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName 'npetrov native validation'
          }
      - uses: actions/cache@v4
        if: env.BUILD_RVC_MODELS == 'true'
        with:
          path: dist/neural-models/common
          key: rvc-common-61d0d059-84f05863-v1
      - name: Prepare offline Russian neural voices for the personal release
        if: env.BUILD_RVC_MODELS == 'true'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m venv .neural-build
          .neural-build/Scripts/python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r scripts/neural-build-requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Neural export dependency installation failed' }
          .neural-build/Scripts/python scripts/prepare-neural-voices.py
          if ($LASTEXITCODE -ne 0) { throw 'Neural model preparation failed' }
      - name: Compare light and full AI speed and memory on real speech
        if: env.BUILD_RVC_MODELS == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: .neural-build/Scripts/python scripts/benchmark-neural.py
      - name: Build application and single EXE installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -EnableVBCableIntegration:($env:VBCABLE_INTEGRATION_AUTHORIZED -eq 'true' -or $env:VBCABLE_PERSONAL_SETUP -eq 'true') -IncludeNeuralVoices:(Test-Path dist/neural-models/SOURCES.json) -IncludeNativeSDK:(Test-Path dist/native-sdk/manifest.json)
      - name: Smoke test packaged DSP
        shell: pwsh
        run: |
          python -c "import numpy as np, soundfile as sf; sf.write('smoke-input.wav', np.sin(2*np.pi*220*np.arange(48000)/48000)*0.2, 48000)"
          $process = Start-Process -FilePath dist/VoiceLab/VoiceLab.exe -ArgumentList '--render', 'smoke-input.wav', 'smoke-output.wav', '--preset', 'sakura' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed' }
          python -c "import numpy as np, soundfile as sf; a,r=sf.read('smoke-output.wav'); assert r==48000 and len(a)==96000 and np.max(np.abs(a))>0.01"
      - name: Test install, installed application, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VoiceLab-installed'
          $installTasks = 'desktopicon'
          if (Test-Path dist/neural-models/SOURCES.json) { $installTasks += ',neuralvoices' }
          $installer = Start-Process -FilePath dist/installer/VoiceLab-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/TASKS=$installTasks", "/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Install failed: $($installer.ExitCode)" }
          $app = Join-Path $installDir 'VoiceLab.exe'
          if (-not (Test-Path $app)) { throw 'Installed application is missing' }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'npetrov VoiceLab.lnk'
          $menuShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'npetrov VoiceLab.lnk'
          if (-not (Test-Path $desktopShortcut) -or -not (Test-Path $menuShortcut)) { throw 'Branded application shortcuts are missing' }
          $helperPresent = Test-Path (Join-Path $installDir 'Install-VirtualMicrophone.ps1')
          $integrationEnabled = $env:VBCABLE_INTEGRATION_AUTHORIZED -eq 'true' -or $env:VBCABLE_PERSONAL_SETUP -eq 'true'
          if ($helperPresent -ne $integrationEnabled) { throw 'Virtual microphone integration does not match the selected build' }
          $render = Start-Process -FilePath $app -ArgumentList '--render', 'smoke-input.wav', 'installed-output.wav', '--preset', 'sakura' -Wait -PassThru
          if ($render.ExitCode -ne 0) { throw 'Installed application failed' }
          python -c "import numpy as np, soundfile as sf; a,r=sf.read('installed-output.wav'); assert r==48000 and len(a)==96000 and np.max(np.abs(a))>0.01"
          if (Test-Path dist/neural-models/SOURCES.json) {
            python scripts/smoke-neural-installer.py --app $app --models (Join-Path $installDir 'models')
            if ($LASTEXITCODE -ne 0) { throw 'Installed neural voice processing failed' }
          }
          if (Test-Path dist/native-sdk/manifest.json) {
            New-NetFirewallRule -DisplayName 'npetrov installed native validation' -Direction Outbound -Program $app -Action Block -Profile Any | Out-Null
            try {
              python scripts/run-native-validation.py --models (Join-Path $installDir 'native-sdk') --speech .analysis/speech.wav --app $app --skip-catalogue --output dist/native-installed-benchmark.json
              if ($LASTEXITCODE -ne 0) { throw 'Installed native processing failed' }
            } finally {
              Remove-NetFirewallRule -DisplayName 'npetrov installed native validation'
            }
          }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $app) { throw 'Application was not removed' }
          if ((Test-Path $desktopShortcut) -or (Test-Path $menuShortcut)) { throw 'Application shortcuts were not removed' }
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_release }}
        with:
          name: VoiceLab-Setup-Windows-x64
          retention-days: 1
          path: dist/installer/VoiceLab-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_release }}
        with:
          name: VoiceLab-Setup-checksum
          retention-days: 1
          path: dist/installer/VoiceLab-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish the verified installer
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "from voicelab import __version__; print(__version__)").Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Release tag and app version differ' }
          $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit; use a new version' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This version is already published; use a new version' }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --title "npetrov VoiceLab $tag" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          $releaseAssets = @('dist/installer/VoiceLab-Setup.exe', 'dist/installer/VoiceLab-Setup.exe.sha256')
          foreach ($optionalAsset in @('dist/neural-benchmark.json', 'dist/native-benchmark.json', 'dist/native-reference.wav', 'dist/native-latency.json')) {
            if (Test-Path $optionalAsset) { $releaseAssets += $optionalAsset }
          }
          gh release upload $tag @releaseAssets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the verified installer' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified installer' }
