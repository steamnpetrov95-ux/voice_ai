name: Russian DnD voice auditions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditions:
    if: github.event.repository.private && github.repository == 'steamnpetrov95-ux/voice_ai'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install and test the audition renderer
        run: |
          python -m pip install --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Application installation failed' }
          python -m pytest tests/test_auditions.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Audition tests failed' }
      - name: Restore the pinned personal SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-native-windows.ps1
      - name: Download the real Russian CC0 reference
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Invoke-WebRequest 'https://raw.githubusercontent.com/OHF-Voice/voice-datasets/8ed76fa9001fafc77db32bd682f434938c679e3e/ru_RU/dmitri/0000000001.mp3' -OutFile .analysis/dnd-human-ru.mp3
            if ((Get-FileHash .analysis/dnd-human-ru.mp3 -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0576b8050def5d3635545ed3eaa6d4faaf348f1ff8d0d64443b94485853a2d40') { throw 'Unexpected human reference hash' }
          } catch {
            Write-Host ('::error title=Russian reference::' + $_.Exception.Message.Replace("`r", ' ').Replace("`n", ' '))
            throw
          }
      - name: Compare the same profiles on real speech with networking blocked
        run: |
          $nativePython = (python -c "import sys; print(sys.executable)").Trim()
          New-NetFirewallRule -DisplayName 'npetrov DnD auditions' -Direction Outbound -Program $nativePython -Action Block -Profile Any | Out-Null
          try {
            python scripts/check-native-quality.py --models dist/native-sdk --speech .analysis/dnd-human-ru.mp3
            if ($LASTEXITCODE -ne 0) { throw 'Native quality comparison failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName 'npetrov DnD auditions'
          }
      - name: Attach the listening page to the existing personal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/native-quality/* -DestinationPath dist/native-quality.zip -Force
          gh release upload v0.3.3 dist/DnD-human-voice-check.html dist/native-quality.json dist/native-quality.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Audition page upload failed' }
