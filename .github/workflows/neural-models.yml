name: Inspect neural model assets

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'JSON array of Hugging Face repositories to inspect'
        default: '[]'
        required: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public model schemas and source hashes
        env:
          MODEL_SOURCES: ${{ inputs.sources }}
        run: python scripts/inspect-neural-assets.py
