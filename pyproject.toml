[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelab-desktop"
version = "0.1.1"
description = "Local voice effects and microphone routing for Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "numpy==2.2.6",
  "pedalboard>=0.9.17,<0.10",
  "sounddevice>=0.5,<0.6",
  "soundfile>=0.13,<0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
voicelab = "voicelab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
